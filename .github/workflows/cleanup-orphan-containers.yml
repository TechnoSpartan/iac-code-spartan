name: Cleanup Orphan Containers

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Stop orphan containers from deleted services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== All running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>&1

            echo ""
            echo "=== Checking for known orphans ==="
            ORPHANS="trackworks-api trackworks-mongodb trackworks-api-staging trackworks-mongodb-staging kong-cyberdyne cyberdyne-frontend cyberdyne-staging-frontend cyberdyne-frontend-web"
            for c in $ORPHANS; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
                RUNNING=$(docker inspect --format='{{.State.Running}}' "$c" 2>/dev/null || echo "false")
                if [ "$RUNNING" = "true" ]; then
                  echo "STOPPING orphan: $c"
                  docker stop "$c" 2>&1 || true
                  docker rm "$c" 2>&1 || true
                else
                  echo "REMOVING stopped orphan: $c"
                  docker rm "$c" 2>&1 || true
                fi
              else
                echo "Not present: $c"
              fi
            done

            echo ""
            echo "=== Orphan networks from deleted services ==="
            ORPHAN_NETS="kong_cyberdyne trackworks trackworks-staging cyberdyne_internal"
            for n in $ORPHAN_NETS; do
              if docker network ls --format '{{.Name}}' | grep -q "^${n}$"; then
                echo "REMOVING orphan network: $n"
                docker network rm "$n" 2>&1 || echo "  Skipped (still in use)"
              else
                echo "Not present: $n"
              fi
            done

            echo ""
            echo "=== Orphan docker-compose directories ==="
            ORPHAN_DIRS="/opt/codespartan/platform/kong/cyberdyne /opt/codespartan/apps/cyberdyne-systems-es/api /opt/codespartan/apps/cyberdyne-systems-es/api-staging /opt/codespartan/apps/cyberdyne-systems-es/staging /opt/codespartan/apps/cyberdyne-systems-es/traefik /opt/codespartan/apps/codespartan-cloud/api /opt/codespartan/apps/codespartan-cloud/api-staging /opt/codespartan/apps/codespartan-cloud/staging"
            for d in $ORPHAN_DIRS; do
              if [ -d "$d" ]; then
                echo "PRESENT (needs manual review): $d"
                ls "$d" 2>&1 || true
              else
                echo "Already cleaned: $d"
              fi
            done

            echo ""
            echo "=== Containers after cleanup ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1