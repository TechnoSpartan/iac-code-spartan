name: Cleanup Orphan Directories

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove orphan directories from retired services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            ORPHAN_DIRS="
              /opt/codespartan/apps/cyberdyne-systems-es/api
              /opt/codespartan/apps/cyberdyne-systems-es/api-staging
              /opt/codespartan/apps/cyberdyne-systems-es/staging
              /opt/codespartan/apps/cyberdyne-systems-es/traefik
              /opt/codespartan/apps/codespartan-cloud/api
              /opt/codespartan/apps/codespartan-cloud/api-staging
              /opt/codespartan/apps/codespartan-cloud/staging
            "
            for d in $ORPHAN_DIRS; do
              if [ -d "$d" ]; then
                echo "Removing: $d"
                rm -rf "$d"
                echo "  Done"
              else
                echo "Already gone: $d"
              fi
            done

            echo ""
            echo "=== Cleaned up directories ==="
            find /opt/codespartan/apps -maxdepth 3 -type d | sort