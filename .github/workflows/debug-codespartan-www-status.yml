name: Debug Codespartan WWW

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose codespartan-www
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== ALL codespartan containers (including stopped) ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" | grep -i codespartan || echo "No codespartan containers found"

            echo ""
            echo "=== codespartan-www directory ==="
            ls -la /opt/codespartan/apps/codespartan-cloud/www/ 2>&1 || echo "Directory doesn't exist"

            echo ""
            echo "=== codespartan-www .env ==="
            cat /opt/codespartan/apps/codespartan-cloud/www/.env 2>&1 || echo "No .env file"

            echo ""
            echo "=== codespartan-www logs (if exists) ==="
            docker logs codespartan-www --tail 50 2>&1 || echo "Cannot get logs - container doesn't exist"

            echo ""
            echo "=== Traefik routers for codespartan ==="
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | grep -o '"codespartan[^"]*"' || echo "No codespartan routers found"

            echo ""
            echo "=== Network check ==="
            docker network inspect web --format='{{range .Containers}}{{.Name}}: {{.IPv4Address}}{{"\n"}}{{end}}' 2>&1 | grep codespartan || echo "No codespartan containers on web network"