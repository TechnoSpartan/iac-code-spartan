name: Debug Redmine Labels

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect redmine-app labels and env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== redmine-app labels ==="
            docker inspect redmine-app --format='{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' 2>&1 | grep -i traefik || echo "No traefik labels found!"

            echo ""
            echo "=== redmine-app networks ==="
            docker inspect redmine-app --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}: {{$conf.IPAddress}}{{"\n"}}{{end}}' 2>&1

            echo ""
            echo "=== .env file on VPS ==="
            cat /opt/codespartan/apps/codespartan-cloud/redmine/.env 2>&1 || echo "No .env file"

            echo ""
            echo "=== Traefik API: all routers ==="
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | python3 -m json.tool 2>/dev/null | grep -E "name|rule|service" | head -40 || docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | head -100

            echo ""
            echo "=== Traefik API: search for redmine ==="
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | grep -i redmine || echo "No redmine router found in Traefik API"

            echo ""
            echo "=== Test local connectivity to redmine ==="
            docker exec traefik wget -qO- --timeout=3 http://redmine-app:3000/ 2>&1 | head -5 || echo "Cannot connect to redmine-app:3000"

            echo ""
            echo "=== redmine-app container status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep redmine

            echo ""
            echo "=== docker-compose config (rendered) ==="
            cd /opt/codespartan/apps/codespartan-cloud/redmine && docker compose config 2>&1 | grep -A5 "labels:" | head -30