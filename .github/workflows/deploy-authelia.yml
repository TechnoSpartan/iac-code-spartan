name: Deploy Authelia (FASE 2 - SSO)

on:
  workflow_dispatch:
  push:
    paths:
      - 'codespartan/platform/authelia/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Authelia files
        env:
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          AUTHELIA_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_ENCRYPTION_KEY }}
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_SMTP_HOST: ${{ secrets.AUTHELIA_SMTP_HOST }}
          AUTHELIA_SMTP_PORT: ${{ secrets.AUTHELIA_SMTP_PORT }}
          AUTHELIA_SMTP_USERNAME: ${{ secrets.AUTHELIA_SMTP_USERNAME }}
          AUTHELIA_SMTP_PASSWORD: ${{ secrets.AUTHELIA_SMTP_PASSWORD }}
          AUTHELIA_SMTP_SENDER: ${{ secrets.AUTHELIA_SMTP_SENDER }}
          AUTHELIA_ADMIN_EMAIL: ${{ secrets.AUTHELIA_ADMIN_EMAIL }}
          AUTHELIA_ADMIN_PASSWORD_HASH: ${{ secrets.AUTHELIA_ADMIN_PASSWORD_HASH }}
        run: |
          mkdir -p artifacts/authelia
          cp -r codespartan/platform/authelia/* artifacts/authelia/

          # Generate configuration.yml from template by substituting secrets
          echo "🔐 Generating configuration.yml from template with secrets..."
          envsubst < codespartan/platform/authelia/configuration.yml.template > artifacts/authelia/configuration.yml

          # Verify configuration.yml was created
          if [ ! -f artifacts/authelia/configuration.yml ]; then
            echo "❌ Failed to generate configuration.yml"
            exit 1
          fi

          # Verify no template variables remain (security check)
          if grep -q '\${' artifacts/authelia/configuration.yml; then
            echo "⚠️  WARNING: Template variables still present in configuration.yml"
            grep '\${' artifacts/authelia/configuration.yml
            exit 1
          fi

          echo "✅ configuration.yml generated successfully"

          # Generate users_database.yml from template
          echo "🔐 Generating users_database.yml from template with secrets..."
          envsubst < codespartan/platform/authelia/users_database.yml.template > artifacts/authelia/users_database.yml

          # Verify users_database.yml was created
          if [ ! -f artifacts/authelia/users_database.yml ]; then
            echo "❌ Failed to generate users_database.yml"
            exit 1
          fi

          # Verify no template variables remain (security check)
          if grep -q '\${' artifacts/authelia/users_database.yml; then
            echo "⚠️  WARNING: Template variables still present in users_database.yml"
            grep '\${' artifacts/authelia/users_database.yml
            exit 1
          fi

          echo "✅ users_database.yml generated successfully"

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/codespartan/platform/authelia

      - name: Copy Authelia files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/authelia/*"
          target: "/opt/codespartan/platform/authelia/"
          strip_components: 2

      - name: Deploy Authelia on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/codespartan/platform/authelia

            DEPLOY_START=$(date +%s)

            echo "🚀 FASE 2: Deploying Authelia SSO..."

            # Ensure web network exists
            docker network create web || true

            # Force recreate so bind-mounted configuration.yml / users_database.yml
            # are always reloaded (Authelia does not hot-reload session.cookies).
            echo "📦 Starting Authelia and Redis (force-recreate)..."
            docker compose up -d --force-recreate --remove-orphans

            # Wait for Redis to be healthy
            echo "⏳ Waiting for Redis..."
            MAX_ATTEMPTS=30
            ATTEMPT=0

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              REDIS_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' authelia-redis 2>/dev/null || echo "unknown")

              if [ "$REDIS_HEALTH" = "healthy" ]; then
                echo "✅ Redis is healthy"
                break
              fi

              if [ $ATTEMPT -eq $((MAX_ATTEMPTS - 1)) ]; then
                echo "❌ Redis failed to become healthy"
                docker logs authelia-redis --tail 30
                exit 1
              fi

              echo -n "."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done

            # Healthcheck is disabled in compose (minimal image). Wait until the
            # process answers /api/health instead of container Health.Status.
            echo "⏳ Waiting for Authelia API..."
            ATTEMPT=0

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if docker exec authelia wget -qO- http://127.0.0.1:9091/api/health >/dev/null 2>&1 \
                || curl -fsS http://127.0.0.1:9091/api/health >/dev/null 2>&1; then
                echo "✅ Authelia API is up"
                break
              fi

              RUNNING=$(docker inspect --format='{{.State.Running}}' authelia 2>/dev/null || echo "false")
              if [ "$RUNNING" != "true" ]; then
                echo "❌ Authelia container is not running"
                docker logs authelia --tail 50
                exit 1
              fi

              if [ $ATTEMPT -eq $((MAX_ATTEMPTS - 1)) ]; then
                echo "❌ Authelia API failed to become ready"
                docker logs authelia --tail 50
                exit 1
              fi

              echo -n "."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done

            # Smoke: CRM cookie domain must redirect to auth.codespartan.cloud
            echo "🔍 Verifying ForwardAuth redirect for crm.codespartan.cloud..."
            CRM_VERIFY=$(docker exec authelia wget -qS -O /dev/null \
              --header="X-Forwarded-Proto: https" \
              --header="X-Forwarded-Host: crm.codespartan.cloud" \
              --header="X-Forwarded-Uri: /" \
              --header="Accept: text/html" \
              "http://127.0.0.1:9091/api/verify?rd=https://auth.codespartan.cloud" 2>&1 || true)
            if echo "$CRM_VERIFY" | grep -qE "HTTP/1\.[01] 302" \
              && echo "$CRM_VERIFY" | grep -q "auth.codespartan.cloud"; then
              echo "✅ CRM verify returns 302 → auth.codespartan.cloud"
            else
              echo "❌ CRM verify failed (expect 302 to auth.codespartan.cloud)"
              echo "$CRM_VERIFY" | head -30
              docker logs authelia --tail 20
              exit 1
            fi

            echo "🔍 Verifying mambo-cloud still redirects to auth.mambo-cloud.com..."
            GRAFANA_VERIFY=$(docker exec authelia wget -qS -O /dev/null \
              --header="X-Forwarded-Proto: https" \
              --header="X-Forwarded-Host: grafana.mambo-cloud.com" \
              --header="X-Forwarded-Uri: /" \
              --header="Accept: text/html" \
              "http://127.0.0.1:9091/api/verify?rd=https://auth.mambo-cloud.com" 2>&1 || true)
            if echo "$GRAFANA_VERIFY" | grep -qE "HTTP/1\.[01] 302" \
              && echo "$GRAFANA_VERIFY" | grep -q "auth.mambo-cloud.com"; then
              echo "✅ Grafana verify returns 302 → auth.mambo-cloud.com"
            else
              echo "❌ Grafana verify failed"
              echo "$GRAFANA_VERIFY" | head -30
              exit 1
            fi

            DEPLOY_END=$(date +%s)
            DEPLOY_TIME=$((DEPLOY_END - DEPLOY_START))

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "✨ Authelia deployed successfully in ${DEPLOY_TIME}s!"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "📊 Container status:"
            docker ps --filter "name=authelia" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""

      - name: Verify Authelia portal accessibility
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔍 Verifying Authelia portal..."
            sleep 5

            # Check if Authelia API is responding
            if curl -f -s -o /dev/null http://localhost:9091/api/health; then
              echo "✅ Authelia API is accessible (health check passed)"
            else
              echo "⚠️  Authelia API health check failed"
              echo "Container may still be initializing..."
            fi

            # Check for errors in logs
            if docker logs authelia 2>&1 | grep -qi "level=error"; then
              echo "⚠️  Found errors in Authelia logs:"
              docker logs authelia 2>&1 | grep -i "level=error" | tail -10
            else
              echo "✅ No errors found in Authelia logs"
            fi

            # Check Redis connection
            if docker logs authelia 2>&1 | grep -qi "session.*redis"; then
              echo "✅ Authelia connected to Redis"
            fi

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "🌐 Next Steps:"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "1. Access https://auth.mambo-cloud.com in your browser"
            echo "2. Login with: admin / codespartan123"
            echo "3. Configure MFA (scan QR code with Google Authenticator)"
            echo ""
            echo "⚠️  IMPORTANT: Traefik and Grafana are NOT yet protected by Authelia"
            echo "They still use Basic Auth / direct login."
            echo ""
            echo "To complete FASE 2, run these workflows IN ORDER:"
            echo "  1. ✅ deploy-authelia.yml (THIS WORKFLOW - DONE)"
            echo "  2. ⏳ update-traefik-authelia.yml (NOT CREATED YET)"
            echo "  3. ⏳ update-grafana-authelia.yml (NOT CREATED YET)"
            echo ""
            echo "Or update manually after verifying Authelia works."
            echo "════════════════════════════════════════════════════════════"
