name: Deploy Dental IA

on:
  workflow_dispatch:
  push:
    paths:
      - "codespartan/apps/dental-ia-es/www/**"
    branches:
      - main
  repository_dispatch:
    types: [dental-ia-deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC repository
        uses: actions/checkout@v4
        with:
          path: iac-repo

      - name: Checkout dental-ia.es repository
        uses: actions/checkout@v4
        with:
          repository: TechnoSpartan/dental-ia.es
          path: app-repo
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: technospartan
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/technospartan/dental-ia
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app-repo
          file: ./app-repo/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "iac-repo/codespartan/apps/dental-ia-es/www/docker-compose.yml"
          target: "/opt/codespartan/apps/dental-ia-es/www/"
          strip_components: 5
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "════════════════════════════════════════════════════════════"
            echo "🚀 DEPLOYING DENTAL IA (DentalFlow)"
            echo "════════════════════════════════════════════════════════════"

            cd /opt/codespartan/apps/dental-ia-es/www
            DEPLOY_START=$(date +%s)

            docker network create web 2>/dev/null || echo "Network 'web' already exists"

            echo "🔐 Logging in to GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u technospartan --password-stdin

            # Cleanup legacy nginx static mount leftovers if present
            rm -rf ./html 2>/dev/null || true

            cat > .env <<EOF
            NODE_ENV=production
            EOF

            echo "📦 Pulling latest Docker image..."
            docker compose pull

            echo "🚀 Starting container..."
            docker compose up -d --force-recreate --remove-orphans

            echo "🔍 Running health checks..."
            sleep 3

            if ! docker inspect dental-ia-web >/dev/null 2>&1; then
              echo "❌ Container dental-ia-web does not exist"
              docker compose ps -a || true
              docker ps -a --filter "name=dental" || true
              exit 1
            fi

            ATTEMPTS=0
            MAX_ATTEMPTS=30

            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              RUNNING=$(docker inspect --format='{{.State.Running}}' dental-ia-web 2>/dev/null || echo "false")
              HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' dental-ia-web 2>/dev/null || echo "unknown")
              HTTP_CODE=$(docker exec dental-ia-web node -e "require('http').get('http://127.0.0.1:3000/api/health',r=>{process.stdout.write(String(r.statusCode));process.exit(0)}).on('error',()=>{process.stdout.write('000');process.exit(0)})" 2>/dev/null || echo "000")

              echo "⏳ running=$RUNNING health=$HEALTH http=$HTTP_CODE ($((ATTEMPTS + 1))/$MAX_ATTEMPTS)"

              if [ "$RUNNING" = "true" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "none" ] || [ "$HTTP_CODE" = "200" ]; }; then
                if [ "$HTTP_CODE" = "200" ] || [ "$HEALTH" = "healthy" ]; then
                  DEPLOY_END=$(date +%s)
                  DEPLOY_TIME=$((DEPLOY_END - DEPLOY_START))

                  echo "✅ Health check passed!"
                  docker image prune -f

                  echo ""
                  echo "════════════════════════════════════════════════════════════"
                  echo "✅ DEPLOYMENT SUCCESSFUL (${DEPLOY_TIME}s)"
                  echo "════════════════════════════════════════════════════════════"
                  docker ps --filter "name=dental-ia-web" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
                  echo ""
                  echo "🌐 URL: https://dental-ia.es"
                  echo "🌐 URL: https://www.dental-ia.es"
                  exit 0
                fi
              fi

              if [ "$RUNNING" != "true" ]; then
                echo "⚠️  Container not running — logs:"
                docker logs --tail 80 dental-ia-web || true
                docker inspect --format='{{json .State}}' dental-ia-web || true
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 3
            done

            echo "❌ Health check timeout"
            docker ps -a --filter "name=dental-ia-web"
            docker logs --tail 80 dental-ia-web || true
            exit 1

      - name: Verify production URL
        if: success()
        run: |
          echo "🌐 Verifying production URLs..."
          sleep 10

          for URL in https://dental-ia.es https://www.dental-ia.es; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ $URL is live (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  $URL returned HTTP $HTTP_STATUS (SSL/propagation may need 1-2 min)"
            fi
          done
