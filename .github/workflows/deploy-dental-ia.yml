name: Deploy Dental IA

on:
  workflow_dispatch:
  push:
    paths:
      - 'codespartan/apps/dental-ia-es/www/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p artifacts/dental-ia
          cp -r codespartan/apps/dental-ia-es/www/* artifacts/dental-ia/

      - name: Prepare remote dir
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/codespartan/apps/dental-ia-es/www

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/dental-ia/*"
          target: "/opt/codespartan/apps/dental-ia-es/www"
          strip_components: 2

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euxo pipefail
            docker network create web 2>/dev/null || true
            if [ -d /opt/codespartan/apps/dental-io-com/www ]; then
              docker compose --env-file /opt/codespartan/apps/dental-io-com/www/.env \
                -f /opt/codespartan/apps/dental-io-com/www/docker-compose.yml down || true
            fi
            docker rm -f dental-io-web 2>/dev/null || true

            cat > /opt/codespartan/apps/dental-ia-es/www/.env <<EOF
            BASE_DOMAIN=dental-ia.es
            EOF
            cd /opt/codespartan/apps/dental-ia-es/www
            docker compose --env-file .env pull
            docker compose --env-file .env down
            docker compose --env-file .env up -d

            echo "=== Verifying container is running ==="
            docker ps | grep dental-ia-web || (echo "ERROR: dental-ia-web not running" && exit 1)

            echo "Dental IA deployment completed successfully"
