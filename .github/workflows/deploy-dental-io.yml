name: Deploy Dental IO

on:
  workflow_dispatch:
  push:
    paths:
      - 'codespartan/apps/dental-io-com/www/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p artifacts/dental-io
          cp -r codespartan/apps/dental-io-com/www/* artifacts/dental-io/

      - name: Prepare remote dir
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/codespartan/apps/dental-io-com/www

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/dental-io/*"
          target: "/opt/codespartan/apps/dental-io-com/www"
          strip_components: 2

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euxo pipefail
            docker network create web 2>/dev/null || true
            cat > /opt/codespartan/apps/dental-io-com/www/.env <<EOF
            BASE_DOMAIN=${{ secrets.DENTAL_BASE_DOMAIN }}
            EOF
            cd /opt/codespartan/apps/dental-io-com/www
            docker compose --env-file .env pull
            docker compose --env-file .env down
            docker compose --env-file .env up -d

            echo "=== Verifying container is running ==="
            docker ps | grep dental-io-web || (echo "ERROR: dental-io-web not running" && exit 1)

            echo "✅ Dental IO deployment completed successfully"
