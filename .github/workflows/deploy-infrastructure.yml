name: Deploy Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - debug-public-api
  push:
    paths:
      - 'codespartan/infra/hetzner/**'
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codespartan/infra/hetzner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Import existing resources (if not already imported)
        run: |
          chmod +x ./import-existing-resources.sh
          ./import-existing-resources.sh
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      # TEMPORAL: depura por que api.cyberdyne-systems.es publico devuelve 404
      # en vez de pasar por Kong. Borrar tras usarlo.
      - name: Debug public API routing
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'debug-public-api'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APIS_VPS_SSH_HOST }}
          username: ${{ secrets.APIS_VPS_SSH_USER }}
          key: ${{ secrets.APIS_VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            ANON_KEY=$(grep '^ANON_KEY=' /home/deploy/platform/supabase/.env | cut -d= -f2-)
            echo "-- public, no apikey (expect 401 from Kong if routed correctly)"
            curl -sS -w "\nHTTP %{http_code}\n" https://api.cyberdyne-systems.es/auth/v1/health
            echo ""
            echo "-- public, with apikey"
            curl -sS -w "\nHTTP %{http_code}\n" -H "apikey: ${ANON_KEY}" https://api.cyberdyne-systems.es/auth/v1/health
            echo ""
            echo "-- verbose TLS/routing trace"
            curl -sSv -o /dev/null -H "apikey: ${ANON_KEY}" https://api.cyberdyne-systems.es/auth/v1/health 2>&1 | head -30

      - name: Check Traefik config on ARM box
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'debug-public-api'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "-- dynamic-config.yml on disk (cyberdyne-api section) --"
            grep -A6 "cyberdyne-api" /opt/codespartan/platform/traefik/dynamic-config.yml || echo "NOT FOUND on disk"
            echo ""
            echo "-- curl Kong directly from ARM box over private network --"
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://10.0.0.3:8000/auth/v1/health || echo "connection failed"
            echo ""
            echo "-- recent traefik logs mentioning cyberdyne-api or file provider --"
            docker logs traefik --tail 200 2>&1 | grep -i "cyberdyne-api\|dynamic-config\|file provider" | tail -30 || echo "no matches"
            echo ""
            echo "-- any docker container/label mentioning cyberdyne or api.cyberdyne --"
            docker ps -a --format '{{.Names}}' | xargs -I{} sh -c 'docker inspect {} --format "{{.Name}}: {{json .Config.Labels}}"' 2>/dev/null | grep -i "cyberdyne" || echo "none found"
            echo ""
            echo "-- traefik logs: errors/acme in last 300 lines --"
            docker logs traefik --tail 300 2>&1 | grep -iE "error|acme|cyberdyne" | tail -40 || echo "no matches"
            echo ""
            echo "-- try Traefik internal API via docker exec --"
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | head -c 3000 || echo "wget failed/unavailable in traefik image"
            echo ""
            echo "-- can the traefik CONTAINER itself reach Kong on the private network? --"
            docker exec traefik wget -qO- --timeout=5 http://10.0.0.3:8000/auth/v1/health 2>&1 || echo "unreachable from inside traefik container"
            echo ""
            echo "-- traefik container network interfaces/routes --"
            docker exec traefik sh -c 'command -v ip >/dev/null && ip route || echo "no ip command"' 2>&1
            echo ""
            echo "-- traefik container networks (docker inspect) --"
            docker inspect traefik --format '{{json .NetworkSettings.Networks}}' 2>&1
            echo ""
            echo "-- host: ip_forward sysctl --"
            sysctl net.ipv4.ip_forward
            echo ""
            echo "-- host: ip route get 10.0.0.3 --"
            ip route get 10.0.0.3
            echo ""
            echo "-- host: ip route get 10.0.0.3 from web bridge subnet (172.18.0.3) --"
            ip route get 10.0.0.3 from 172.18.0.3 || echo "route lookup with source failed"
            echo ""
            echo "-- host: iptables nat POSTROUTING --"
            sudo iptables -t nat -L POSTROUTING -n -v | head -30
            echo ""
            echo "-- host: ping 10.0.0.3 from web bridge namespace via nsenter-free test (host curl for comparison) --"
            curl -sS -o /dev/null -w "host curl: HTTP %{http_code}\n" http://10.0.0.3:8000/auth/v1/health || echo "host curl failed"
            echo ""
            echo "-- host: DOCKER-USER chain (processed before Docker's own FORWARD rules) --"
            sudo iptables -L DOCKER-USER -n -v
            echo ""
            echo "-- traefik container: ping + gateway reachability --"
            docker exec traefik sh -c 'ping -c2 -W3 172.18.0.1 2>&1; echo "---"; ping -c2 -W3 10.0.0.3 2>&1' || true
            echo ""
            echo "-- traefik container: nc test to kong port --"
            docker exec traefik sh -c 'command -v nc >/dev/null && nc -zvw3 10.0.0.3 8000 2>&1 || echo "no nc"'

