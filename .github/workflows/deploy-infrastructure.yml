name: Deploy Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - check-alerts-v2
  push:
    paths:
      - 'codespartan/infra/hetzner/**'
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codespartan/infra/hetzner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Import existing resources (if not already imported)
        run: |
          chmod +x ./import-existing-resources.sh
          ./import-existing-resources.sh
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key_content: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_apis_deploy_ssh_public_key_content: ${{ secrets.APIS_DEPLOY_SSH_PUBLIC_KEY }}

      # TEMPORAL: tercera alerta reportada por el usuario. Consulta
      # alertmanager/vmalert desde dentro de sus propios contenedores (sus
      # puertos no estan publicados al host) + estado actual. Solo lectura.
      # Borrar tras usarlo.
      - name: Check active alerts v2
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'check-alerts-v2'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -uo pipefail
            echo "-- alertmanager: active alerts (queried from inside its own container) --"
            docker exec alertmanager wget -qO- http://localhost:9093/api/v2/alerts 2>&1
            echo ""
            echo ""
            echo "-- vmalert: firing/pending alerts (from inside its own container) --"
            docker exec vmalert wget -qO- http://localhost:8880/api/v1/alerts 2>&1 | head -c 6000
            echo ""
            echo ""
            echo "-- uptime / any new reboot? --"
            uptime
            last reboot -F | head -3
            echo ""
            echo "-- full docker ps -a right now --"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}'
            echo ""
            echo "-- ntfy-forwarder logs, last 3 hours --"
            docker logs ntfy-forwarder --since 3h 2>&1 | tail -60
            echo ""
            echo "-- traefik errors in the last hour --"
            docker logs traefik --since 1h 2>&1 | grep -iE "error|502|503|504" | tail -30 || echo "no errors in the last hour"
            echo ""
            echo "-- disk/mem right now --"
            df -h / 2>&1
            free -h 2>&1
