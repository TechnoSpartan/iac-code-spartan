name: Deploy Kong Cyberdyne (FASE 3 - API Gateway)

on:
  workflow_dispatch:
  push:
    paths:
      - 'codespartan/platform/kong/cyberdyne/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Kong config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "codespartan/platform/kong/cyberdyne/*"
          target: "/opt/codespartan/platform/kong/cyberdyne/"
          strip_components: 4

      - name: Deploy Kong
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_START=$(date +%s)

            echo "🔧 Preparando despliegue de Kong Cyberdyne..."
            cd /opt/codespartan/platform/kong/cyberdyne

            # Verificar que redes existen
            echo "🌐 Verificando redes Docker..."
            docker network create web 2>/dev/null || true
            docker network create kong_cyberdyne \
              --driver bridge \
              --internal \
              --subnet 172.26.0.0/24 2>/dev/null || true

            # Validar configuracion Kong
            echo "✅ Validando configuracion kong.yml..."
            docker run --rm -v $(pwd)/kong.yml:/kong.yml kong:3.9-alpine \
              kong config parse /kong.yml || {
                echo "❌ Error: kong.yml invalido"
                exit 1
              }

            # Pull imagen
            echo "📦 Descargando imagen Kong..."
            docker compose pull

            # Deploy
            echo "🚀 Desplegando Kong..."
            docker compose up -d

            # Health check
            echo "🔍 Verificando salud de Kong..."
            HEALTH_ATTEMPTS=0
            MAX_ATTEMPTS=20

            while [ $HEALTH_ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' kong-cyberdyne 2>/dev/null || echo "starting")

              if [ "$HEALTH" = "healthy" ]; then
                echo "✅ Kong esta saludable"
                break
              fi

              echo "⏳ Estado: $HEALTH - esperando... ($((HEALTH_ATTEMPTS + 1))/$MAX_ATTEMPTS)"
              HEALTH_ATTEMPTS=$((HEALTH_ATTEMPTS + 1))
              sleep 3
            done

            if [ $HEALTH_ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "❌ Kong no alcanzo estado saludable"
              docker logs kong-cyberdyne --tail 50
              exit 1
            fi

            DEPLOY_END=$(date +%s)
            DEPLOY_TIME=$((DEPLOY_END - DEPLOY_START))

            echo ""
            echo "════════════════════════════════════════════════════════"
            echo "✨ Kong Cyberdyne desplegado exitosamente!"
            echo "⏱️  Tiempo: ${DEPLOY_TIME}s"
            echo "════════════════════════════════════════════════════════"
            echo ""
            docker ps --filter "name=kong-cyberdyne" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Verify Traefik Discovery
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔍 Verificando discovery de Traefik..."
            sleep 5

            # Check if Traefik discovered Kong router
            ROUTER_CHECK=$(docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>/dev/null | grep -c "kong-cyberdyne" || echo "0")

            if [ "$ROUTER_CHECK" -gt "0" ]; then
              echo "✅ Traefik descubrio Kong correctamente"
            else
              echo "⚠️ Traefik aun no descubre Kong (puede tomar unos segundos)"
            fi

            echo ""
            echo "════════════════════════════════════════════════════════"
            echo "📋 Proximos pasos:"
            echo "════════════════════════════════════════════════════════"
            echo ""
            echo "1. Modificar API Cyberdyne para usar red kong_cyberdyne"
            echo "2. Quitar labels Traefik de la API"
            echo "3. Redeploy API: docker compose down && docker compose up -d"
            echo ""
            echo "🔗 Endpoints (despues de migrar API):"
            echo "  - Produccion: https://api.cyberdyne-systems.es"
            echo "  - Staging: https://api-staging.cyberdyne-systems.es"
            echo "  - Metricas: http://localhost:8100/metrics (interno)"
            echo ""
