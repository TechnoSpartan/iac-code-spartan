name: Diagnose Active Alerts

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check vmalert & ContainerDown status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Active vmalert alerts ==="
            curl -s http://localhost:8880/api/v1/alerts 2>&1 | python3 -c "
import sys, json
data = json.load(sys.stdin)
alerts = data.get('data', {}).get('alerts', [])
active = [a for a in alerts if a.get('active')]
print(f'Total active alerts: {len(active)}')
for a in active:
    labels = a.get('labels', {})
    print(f'  {labels.get(\"alertname\", \"?\")} — {labels.get(\"alertstate\", \"?\")}')
    print(f'    instance={labels.get(\"instance\", \"?\")}  job={labels.get(\"job\", \"?\")}  severity={labels.get(\"severity\", \"?\")}')
    print(f'    name={labels.get(\"name\", \"?\")}')
" 2>&1 || echo "vmalert API not accessible"

            echo ""
            echo "=== Current ContainerDown rule on VPS ==="
            grep -A8 "ContainerDown" /opt/codespartan/platform/stacks/monitoring/victoriametrics/rules/basic-alerts.yml 2>&1
            grep -A8 "ContainerDown" /opt/codespartan/platform/stacks/monitoring/alerts/rules.yml 2>&1

            echo ""
            echo "=== vmagent scrape targets ==="
            curl -s http://localhost:8429/targets 2>&1 | python3 -c "
import sys, json
data = json.load(sys.stdin)
targets = data.get('data', {}).get('activeTargets', [])
for t in targets:
    labels = t.get('labels', {})
    health = t.get('health', '?')
    url = labels.get('instance', '?')
    job = labels.get('job', '?')
    up = 'UP' if health == 'up' else 'DOWN'
    print(f'  [{up}] {job} — {url}')
" 2>&1 || echo "vmagent API not accessible"