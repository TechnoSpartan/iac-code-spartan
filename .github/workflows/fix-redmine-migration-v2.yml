name: Fix Redmine Migration v2

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run migration with explicit SECRET_KEY_BASE
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euxo pipefail

            echo "=== Checking config/configuration.yml for secret_key_base ==="
            docker exec redmine-app cat /usr/src/redmine/config/configuration.yml 2>&1 | grep -i secret || echo "No secret_key_base in configuration.yml"

            echo ""
            echo "=== Checking environment variable ==="
            docker exec redmine-app printenv | grep -i SECRET || echo "No SECRET env var"

            echo ""
            echo "=== Running migration with explicit SECRET_KEY_BASE ==="
            docker exec redmine-app bash -c 'export SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" && bundle exec rake redmine:plugins:migrate RAILS_ENV=production' 2>&1 || echo "Migration still failed"

            echo ""
            echo "=== Restarting redmine-app ==="
            docker restart redmine-app
            sleep 30

            echo ""
            echo "=== Testing redmine-app response ==="
            docker exec redmine-app wget -qO- --timeout=5 http://localhost:3000/ 2>&1 | head -5 || echo "Cannot connect"

            echo ""
            echo "=== Container status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep redmine

            echo ""
            echo "=== Traefik router check ==="
            sleep 10
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | grep -o '"redmine@docker"' || echo "No redmine router"

            echo ""
            echo "=== External curl test ==="
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" -k https://project.codespartan.cloud/ 2>&1 || echo "curl failed"