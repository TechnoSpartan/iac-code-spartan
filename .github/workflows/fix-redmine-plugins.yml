name: Fix Redmine Plugins Migration

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run plugin migrations and verify network
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euxo pipefail

            echo "=== Current container status ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}" | grep redmine

            echo ""
            echo "=== Networks of redmine-app ==="
            docker inspect redmine-app --format='{{json .NetworkSettings.Networks}}' 2>&1 | python3 -m json.tool 2>/dev/null || docker inspect redmine-app --format='{{json .NetworkSettings.Networks}}' 2>&1

            echo ""
            echo "=== Containers on web network ==="
            docker network inspect web --format='{{range .Containers}}{{.Name}}: {{.IPv4Address}}{{"\n"}}{{end}}' 2>&1

            echo ""
            echo "=== Running plugin migrations inside redmine-app ==="
            docker exec -i redmine-app bundle exec rake redmine:plugins:migrate RAILS_ENV=production 2>&1 || echo "Migration command failed"

            echo ""
            echo "=== Restarting redmine-app to pick up migrations ==="
            docker restart redmine-app
            sleep 15

            echo ""
            echo "=== Testing redmine-app from traefik ==="
            docker exec traefik wget -qO- --timeout=5 http://redmine-app:3000/ 2>&1 | head -10 || echo "Cannot connect from traefik"

            echo ""
            echo "=== Testing redmine-app locally ==="
            docker exec redmine-app wget -qO- --timeout=5 http://localhost:3000/ 2>&1 | head -10 || echo "Cannot connect locally"

            echo ""
            echo "=== Container status after fix ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep redmine

            echo ""
            echo "=== Traefik API: check for redmine router ==="
            sleep 5
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>&1 | grep -i redmine || echo "No redmine router found in Traefik"