name: Get Authelia OTP Registration Link

on:
  workflow_dispatch:

jobs:
  get-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check for pending OTP notification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "════════════════════════════════════════════════════════════"
            echo "📧 CHECKING NOTIFICATIONS FILE FOR OTP LINK"
            echo "════════════════════════════════════════════════════════════"

            # Check if notifications file exists
            if docker exec authelia test -f /data/notifications.txt; then
              echo "✅ Notifications file found"
              echo ""
              echo "This repo is public, so Actions logs are visible to anyone —"
              echo "the OTP registration link is no longer printed here."
              echo ""
              echo "Fetch it yourself over SSH instead:"
              echo "  ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \\"
              echo "    'docker exec authelia tail -100 /data/notifications.txt'"
            else
              echo "❌ No notifications file found yet"
              echo ""
              echo "You need to click 'Añadir' in the OTP section first"
            fi
