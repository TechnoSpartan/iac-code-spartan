name: Restart Traefik + Verify

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Traefik and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== Verify dynamic-config.yml on VPS ==="
            grep -c "codespartan-apex" /opt/codespartan/platform/traefik/dynamic-config.yml && echo "Apex redirect found" || echo "Apex redirect NOT found"

            echo ""
            echo "=== Restarting Traefik ==="
            docker restart traefik
            sleep 10

            echo "=== Traefik logs (last 20 lines) ==="
            docker logs traefik --tail 20 2>&1

            echo ""
            echo "=== Traefik status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep traefik

            echo ""
            echo "=== Testing apex redirect ==="
            curl -s -o /dev/null -w "HTTP %{http_code} -> %{redirect_url}\n" -k https://codespartan.cloud/ 2>&1

            echo ""
            echo "=== Testing www ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -k https://www.codespartan.cloud/ 2>&1

            echo ""
            echo "=== Testing ui ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -k https://ui.codespartan.cloud/ 2>&1

            echo ""
            echo "=== Traefik logs for cert issuance ==="
            sleep 5
            sleep 30
            docker logs traefik --tail 50 2>&1 | grep -iE "codespartan|certificate|acme|error" | tail -20 || echo "No relevant logs"