name: Show Authelia Users Database

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Show Authelia status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "════════════════════════════════════════════════════════════"
            echo "📄 USERS DATABASE FILE"
            echo "════════════════════════════════════════════════════════════"
            echo "Contents are no longer printed here (this repo is public and"
            echo "Actions logs are visible to anyone). Check manually over SSH:"
            echo "  ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \\"
            echo "    'cat /opt/codespartan/platform/authelia/users_database.yml'"
            echo "Users configured (names only, no hashes):"
            grep -E '^\s+[a-zA-Z0-9_-]+:\s*$' /opt/codespartan/platform/authelia/users_database.yml | sed 's/^/  /' || true

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "🐳 AUTHELIA STATUS"
            echo "════════════════════════════════════════════════════════════"
            docker ps --filter "name=authelia" --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "📝 AUTHELIA LOGS (last 20 lines)"
            echo "════════════════════════════════════════════════════════════"
            docker logs authelia --tail 20
