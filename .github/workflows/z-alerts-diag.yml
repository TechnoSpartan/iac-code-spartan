name: Z Alerts Diagnostic

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check active alerts on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Active vmalert alerts ==="
            curl -s http://localhost:8880/api/v1/alerts 2>&1 | head -100

            echo ""
            echo "=== ContainerDown rule (alerts/rules.yml) ==="
            grep -A8 "ContainerDown" /opt/codespartan/platform/stacks/monitoring/alerts/rules.yml 2>&1 || echo "NOT FOUND"

            echo ""
            echo "=== ContainerDown rule (basic-alerts.yml) ==="
            grep -A8 "ContainerDown" /opt/codespartan/platform/stacks/monitoring/victoriametrics/rules/basic-alerts.yml 2>&1 || echo "NOT FOUND"

            echo ""
            echo "=== InstanceDown / ServiceDown rules ==="
            grep -B2 -A8 "up == 0" /opt/codespartan/platform/stacks/monitoring/alerts/rules.yml 2>&1 | head -30
            grep -B2 -A8 "up == 0" /opt/codespartan/platform/stacks/monitoring/victoriametrics/rules/basic-alerts.yml 2>&1 | head -30

            echo ""
            echo "=== vmagent targets ==="
            curl -s http://localhost:8429/targets 2>&1 | head -60

            echo ""
            echo "=== Alertmanager alerts ==="
            curl -s http://localhost:9093/api/v2/alerts 2>&1 | head -100