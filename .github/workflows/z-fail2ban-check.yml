name: Z Fail2ban Metric Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check fail2ban metrics in VictoriaMetrics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Query: fail2ban_up (old metric) ==="
            curl -s "http://localhost:8428/api/v1/query?query=fail2ban_up" 2>&1 | python3 -c "
import sys, json
d = json.load(sys.stdin)
r = d.get('data', {}).get('result', [])
print(f'Results: {len(r)}')
for s in r:
    print(f'  value: {s.get(\"value\", [])[:2]}  labels: {s.get(\"metric\", {})}')
" 2>&1 || echo "query failed"

            echo ""
            echo "=== Query: f2b_up (new metric) ==="
            curl -s "http://localhost:8428/api/v1/query?query=f2b_up" 2>&1 | python3 -c "
import sys, json
d = json.load(sys.stdin)
r = d.get('data', {}).get('result', [])
print(f'Results: {len(r)}')
for s in r:
    print(f'  value: {s.get(\"value\", [])[:2]}  labels: {s.get(\"metric\", {})}')
" 2>&1 || echo "query failed"

            echo ""
            echo "=== Check if old fail2ban-exporter container exists ==="
            docker ps -a --format '{{.Names}} {{.Status}}' 2>&1 | grep fail2ban || echo "No fail2ban container"

            echo ""
            echo "=== f2b_up from node-exporter ==="
            curl -s http://localhost:9100/metrics 2>&1 | grep -i "f2b_up\|fail2ban_up" || echo "No fail2ban metrics in node-exporter"