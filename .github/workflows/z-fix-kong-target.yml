name: Z Fix Kong Target

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale kong-cyberdyne target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== Current prometheus.yml targets ==="
            grep -n "kong\|8100" /opt/codespartan/platform/stacks/monitoring/victoriametrics/prometheus.yml 2>&1 || echo "No kong target found"

            echo ""
            echo "=== vmagent scrape targets (down ones) ==="
            curl -s http://localhost:8429/api/v1/targets 2>&1 | python3 -c "
import sys, json
d = json.load(sys.stdin)
for t in d.get('data', {}).get('activeTargets', []):
    if t.get('health') != 'up':
        print(f\"  DOWN: {t.get('labels', {}).get('instance', '?')} ({t.get('scrapeUrl', '?')})\")
" 2>&1 || echo "Cannot query vmagent"

            echo ""
            echo "=== Restart vmagent with latest config ==="
            docker restart vmagent
            sleep 5

            echo ""
            echo "=== vmagent targets after restart ==="
            curl -s http://localhost:8429/api/v1/targets 2>&1 | python3 -c "
import sys, json
d = json.load(sys.stdin)
for t in d.get('data', {}).get('activeTargets', []):
    h = t.get('health', '?')
    print(f\"  [{h}] {t.get('labels', {}).get('instance', '?')}\")
" 2>&1 || echo "Cannot query"