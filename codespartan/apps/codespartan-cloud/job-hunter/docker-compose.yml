services:
  job-hunter-bot:
    image: ${JOB_HUNTER_BOT_IMAGE:-ghcr.io/technospartan/job-hunter-bot:latest}
    container_name: job-hunter-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - job-hunter-data:/app/data
    networks:
      - web
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.job-hunter-api.rule=Host(`${JOB_HUNTER_API_HOST}`)
      - traefik.http.routers.job-hunter-api.entrypoints=websecure
      - traefik.http.routers.job-hunter-api.tls=true
      - traefik.http.routers.job-hunter-api.tls.certresolver=le
      - traefik.http.services.job-hunter-api.loadbalancer.server.port=3101
      - traefik.http.routers.job-hunter-api.middlewares=rate-limit-api@file,security-headers@file,compression@file
      - traefik.docker.network=web

