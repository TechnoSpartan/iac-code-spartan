services:
  web:
    image: ghcr.io/technospartan/codespartan-www:latest
    container_name: codespartan-www
    restart: unless-stopped

    environment:
      # OpenAI API Key for chatbot
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Next.js environment
      - NODE_ENV=production

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M  # Increased for Next.js SSR
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.http.routers.codespartan-www.rule=Host(`www.codespartan.cloud`)
      - traefik.http.routers.codespartan-www.entrypoints=websecure
      - traefik.http.routers.codespartan-www.tls=true
      - traefik.http.routers.codespartan-www.tls.certresolver=le
      - traefik.http.services.codespartan-www.loadbalancer.server.port=3000
      - traefik.docker.network=web

    networks:
      - web

networks:
  web:
    external: true
