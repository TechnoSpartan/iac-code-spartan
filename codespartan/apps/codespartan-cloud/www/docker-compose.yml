name: codespartan-www

services:
  web:
    image: ghcr.io/technospartan/codespartan-www:latest
    container_name: codespartan-www
    restart: unless-stopped

    environment:
      # OpenAI API Key for chatbot
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Brevo (email de notificacion del formulario de contacto)
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-noreply@codespartan.cloud}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-CodeSpartan Web}
      - BREVO_TO_EMAIL=${BREVO_TO_EMAIL:-contacto@codespartan.es}
      # Microsoft Bookings (calendario de citas en /contacto)
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_BOOKINGS_BUSINESS_ID=${MICROSOFT_BOOKINGS_BUSINESS_ID}
      # Twenty CRM (self-hosted, red privada codespartan-internal)
      - TWENTY_API_KEY=${TWENTY_API_KEY}
      - TWENTY_API_URL=${TWENTY_API_URL:-http://10.0.0.3:3000}
      # Next.js environment
      - NODE_ENV=production

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M  # Increased for Next.js SSR
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.http.routers.codespartan-www.rule=Host(`www.codespartan.cloud`)
      - traefik.http.routers.codespartan-www.entrypoints=websecure
      - traefik.http.routers.codespartan-www.tls=true
      - traefik.http.routers.codespartan-www.tls.certresolver=le
      - traefik.http.routers.codespartan-www.middlewares=security-headers@file,compression@file
      - traefik.http.services.codespartan-www.loadbalancer.server.port=3000
      - traefik.docker.network=web

    networks:
      - web

networks:
  web:
    external: true
