services:
  mongodb:
    image: mongo:8.0
    container_name: trackworks-mongodb-staging
    ports:
      - "27018:27017"
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=trackworks
    volumes:
      - trackworks-mongodb-staging-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - trackworks-staging

  api:
    image: ghcr.io/technospartan/ms-nd-bko-trackworks:staging-latest
    container_name: trackworks-api-staging
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - API_VERSION=v1
      - ALLOWED_ORIGINS=https://staging.cyberdyne-systems.es,https://lab.cyberdyne-systems.es
      - USE_DATABASE=true
      - MONGODB_URI=mongodb://mongodb:27017/trackworks
      - API_BASE_PATH=/api
      - LOG_LEVEL=debug
    volumes:
      - trackworks-staging-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Traefik labels removed - Kong handles routing now
    # See: codespartan/platform/kong/cyberdyne/
    networks:
      - kong_cyberdyne
      - trackworks-staging

volumes:
  trackworks-staging-data:
    driver: local
  trackworks-mongodb-staging-data:
    driver: local

networks:
  kong_cyberdyne:
    external: true
  trackworks-staging:
    driver: bridge
