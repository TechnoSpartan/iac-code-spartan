services:
  mongodb:
    image: mongo:8.0
    container_name: trackworks-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - trackworks

  api:
    image: ghcr.io/technospartan/ms-nd-bko-trackworks:latest
    container_name: trackworks-api
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_VERSION=v1
      - ALLOWED_ORIGINS=https://cyberdyne-systems.es,https://www.cyberdyne-systems.es,https://staging.cyberdyne-systems.es,https://lab.cyberdyne-systems.es,https://api.cyberdyne-systems.es
      - USE_DATABASE=true
      - MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      - API_BASE_PATH=/api
      - LOG_LEVEL=info
    volumes:
      - trackworks-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Traefik labels removed - Kong handles routing now
    # See: codespartan/platform/kong/cyberdyne/
    networks:
      - kong_cyberdyne
      - trackworks

volumes:
  trackworks-data:
    driver: local
  mongodb-data:
    driver: local

networks:
  kong_cyberdyne:
    external: true
  trackworks:
    name: api_trackworks
    driver: bridge
    internal: true  # No internet access - isolated network
    ipam:
      config:
        - subnet: 172.22.0.0/24
