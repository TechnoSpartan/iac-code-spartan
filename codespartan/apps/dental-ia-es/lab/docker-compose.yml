name: dental-lab

services:
  backend:
    image: ghcr.io/technospartan/dental-lab-backend:latest
    container_name: dental-lab-backend
    restart: unless-stopped

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dental_lab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_lab}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://lab.dental-ia.es}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://lab.dental-ia.es}
      - PORT=3001
      - AUTOMATIONS_SCAN_INTERVAL_MS=${AUTOMATIONS_SCAN_INTERVAL_MS:-300000}
      - BREVO_API_KEY=${BREVO_API_KEY:-}

    ports:
      # Solo IP privada (red codespartan-internal) — Traefik en el VPS
      # principal termina TLS y reenvía aqui (ver
      # codespartan/platform/traefik/dynamic/dynamic-config.yml, routers
      # "dental-lab-api"/"dental-lab-www").
      - "10.0.0.3:3091:3001"

    networks:
      - dental_lab_internal

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/technospartan/dental-lab-frontend:latest
    container_name: dental-lab-frontend
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

    ports:
      # Solo IP privada — igual que backend, alcanzado vía Traefik.
      - "10.0.0.3:3090:3000"

    depends_on:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/login', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 96M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: dental-lab-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dental_lab}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dental_lab}
    volumes:
      - dental_lab_postgres_data:/var/lib/postgresql/data
    networks:
      - dental_lab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  redis:
    image: redis:7-alpine
    container_name: dental-lab-redis
    restart: unless-stopped
    networks:
      - dental_lab_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

volumes:
  dental_lab_postgres_data:
    name: dental_lab_postgres_data

networks:
  dental_lab_internal:
    name: dental_lab_internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.35.0.0/24
