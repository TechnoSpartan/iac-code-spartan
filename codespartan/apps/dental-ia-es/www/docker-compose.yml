name: dental-ia

services:
  web:
    image: ghcr.io/technospartan/dental-ia:latest
    container_name: dental-ia-web
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      # Apex + www (landing pública)
      - traefik.http.routers.dental-www.rule=Host(`dental-ia.es`) || Host(`www.dental-ia.es`)
      - traefik.http.routers.dental-www.entrypoints=websecure
      - traefik.http.routers.dental-www.tls=true
      - traefik.http.routers.dental-www.tls.certresolver=le
      - traefik.http.routers.dental-www.middlewares=security-headers@file,compression@file
      - traefik.http.routers.dental-www.service=dental-web

      # Subdominios reservados (misma imagen hasta que haya staging real)
      - traefik.http.routers.dental-staging.rule=Host(`staging.dental-ia.es`)
      - traefik.http.routers.dental-staging.entrypoints=websecure
      - traefik.http.routers.dental-staging.tls=true
      - traefik.http.routers.dental-staging.tls.certresolver=le
      - traefik.http.routers.dental-staging.middlewares=security-headers@file,compression@file
      - traefik.http.routers.dental-staging.service=dental-web

      - traefik.http.routers.dental-lab.rule=Host(`lab.dental-ia.es`)
      - traefik.http.routers.dental-lab.entrypoints=websecure
      - traefik.http.routers.dental-lab.tls=true
      - traefik.http.routers.dental-lab.tls.certresolver=le
      - traefik.http.routers.dental-lab.middlewares=security-headers@file,compression@file
      - traefik.http.routers.dental-lab.service=dental-web

      - traefik.http.services.dental-web.loadbalancer.server.port=3000

    networks:
      - web

networks:
  web:
    external: true
