name: dental-ia

services:
  web:
    image: ghcr.io/technospartan/dental-ia:latest
    container_name: dental-ia-web
    restart: unless-stopped

    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER}
      - BREVO_SMTP_PASS=${BREVO_SMTP_PASS:-${BREVO_API_KEY}}
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-587}
      - PILOT_FROM_EMAIL=${PILOT_FROM_EMAIL:-noreply@codespartan.cloud}
      - PILOT_FROM_NAME=${PILOT_FROM_NAME:-DentalFlow}
      - PILOT_TO_EMAIL=${PILOT_TO_EMAIL:-contacto@codespartan.es}
      - TWENTY_LEADS_ENABLED=${TWENTY_LEADS_ENABLED:-true}
      - TWENTY_API_KEY=${TWENTY_API_KEY}
      - TWENTY_API_URL=${TWENTY_API_URL:-http://10.0.0.3:3000}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      # Apex + www (landing pública)
      - traefik.http.routers.dental-www.rule=Host(`dental-ia.es`) || Host(`www.dental-ia.es`)
      - traefik.http.routers.dental-www.entrypoints=websecure
      - traefik.http.routers.dental-www.tls=true
      - traefik.http.routers.dental-www.tls.certresolver=le
      - traefik.http.routers.dental-www.middlewares=security-headers@file,compression@file
      - traefik.http.routers.dental-www.service=dental-web

      # Subdominio reservado (misma imagen hasta que haya staging real).
      # lab.dental-ia.es ya NO apunta aquí — repuntado a la app real
      # (ver codespartan/apps/dental-ia-es/lab/).
      - traefik.http.routers.dental-staging.rule=Host(`staging.dental-ia.es`)
      - traefik.http.routers.dental-staging.entrypoints=websecure
      - traefik.http.routers.dental-staging.tls=true
      - traefik.http.routers.dental-staging.tls.certresolver=le
      - traefik.http.routers.dental-staging.middlewares=security-headers@file,compression@file
      - traefik.http.routers.dental-staging.service=dental-web

      - traefik.http.services.dental-web.loadbalancer.server.port=3000

    networks:
      - web

networks:
  web:
    external: true
