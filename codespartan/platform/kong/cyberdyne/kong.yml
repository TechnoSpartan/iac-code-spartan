_format_version: "3.0"
_transform: true

# ==============================================================================
# SERVICES: Upstream backends
# ==============================================================================
services:
  # ---------------------------------------------------------------------------
  # Production API (api.cyberdyne-systems.es)
  # ---------------------------------------------------------------------------
  - name: cyberdyne-api-production
    url: http://trackworks-api:3001
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3

    routes:
      - name: api-production-route
        hosts:
          - api.cyberdyne-systems.es
        paths:
          - /
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

    plugins:
      # Rate Limiting: 50 req/s por IP
      - name: rate-limiting
        config:
          minute: 3000
          second: 50
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: "Rate limit exceeded. Please retry after some time."

      # CORS para produccion
      - name: cors
        config:
          origins:
            - https://cyberdyne-systems.es
            - https://www.cyberdyne-systems.es
            - https://staging.cyberdyne-systems.es
            - https://lab.cyberdyne-systems.es
            - https://api.cyberdyne-systems.es
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Requested-With
            - X-Request-ID
          exposed_headers:
            - X-RateLimit-Limit-Minute
            - X-RateLimit-Remaining-Minute
          credentials: true
          max_age: 3600
          preflight_continue: false

      # Request Transformer: Add tracking headers
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Proxy:true"

  # ---------------------------------------------------------------------------
  # Staging API (api-staging.cyberdyne-systems.es)
  # ---------------------------------------------------------------------------
  - name: cyberdyne-api-staging
    url: http://trackworks-api-staging:3001
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3

    routes:
      - name: api-staging-route
        hosts:
          - api-staging.cyberdyne-systems.es
        paths:
          - /
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

    plugins:
      # Rate Limiting mas permisivo para staging
      - name: rate-limiting
        config:
          minute: 6000
          second: 100
          policy: local
          fault_tolerant: true
          hide_client_headers: false

      # CORS para staging (incluye localhost para desarrollo)
      - name: cors
        config:
          origins:
            - https://staging.cyberdyne-systems.es
            - https://lab.cyberdyne-systems.es
            - http://localhost:3000
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Requested-With
            - X-Request-ID
          credentials: true
          max_age: 3600

      # Request Transformer: Add tracking headers
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Proxy:true"
              - "X-Kong-Environment:staging"

# ==============================================================================
# GLOBAL PLUGINS
# ==============================================================================
plugins:
  # Prometheus metrics (global)
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
