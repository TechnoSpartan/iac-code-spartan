_format_version: "3.0"
_transform: true

# ==============================================================================
# SERVICES: Upstream backends
# ==============================================================================
services:
  # ---------------------------------------------------------------------------
  # Social Posts API (api.cyberdyne-systems.es) — proxies to Supabase Edge Functions
  # ---------------------------------------------------------------------------
  - name: cyberdyne-social-posts-api
    url: https://YOUR-PROJECT-REF.supabase.co   # TODO: replace with your real VITE_SUPABASE_URL
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3

    routes:
      - name: social-posts-api-route
        hosts:
          - api.cyberdyne-systems.es
        paths:
          - /
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https

    plugins:
      # Rate Limiting: 50 req/s por IP
      - name: rate-limiting
        config:
          minute: 3000
          second: 50
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: "Rate limit exceeded. Please retry after some time."

      # CORS
      - name: cors
        config:
          origins:
            - https://cyberdyne-systems.es
            - https://www.cyberdyne-systems.es
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - X-Requested-With
            - X-Request-ID
          exposed_headers:
            - X-RateLimit-Limit-Minute
            - X-RateLimit-Remaining-Minute
          credentials: true
          max_age: 3600
          preflight_continue: false

      # Request Transformer: Add tracking headers
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Proxy:true"

# ==============================================================================
# GLOBAL PLUGINS
# ==============================================================================
plugins:
  # Prometheus metrics (global)
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
