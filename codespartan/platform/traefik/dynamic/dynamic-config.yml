# Traefik Dynamic Configuration
# This file defines middlewares, routers, and services that are loaded dynamically

http:
  middlewares:
    # Global rate limiting - 100 requests per second per IP
    rate-limit-global:
      rateLimit:
        average: 100
        period: 1s
        burst: 50

    # Strict rate limiting for sensitive endpoints - 10 requests per second
    rate-limit-strict:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

    # API rate limiting - 50 requests per second
    rate-limit-api:
      rateLimit:
        average: 50
        period: 1s
        burst: 30

    # Security headers middleware
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"

    # Compression middleware
    compression:
      compress: {}

    # CORS middleware for APIs
    cors-api:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true

    # HTTP to HTTPS redirect
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    # Redirect codespartan.cloud apex -> www.codespartan.cloud
    codespartan-apex-redirect:
      redirectRegex:
        regex: "^https://codespartan\\.cloud/(.*)"
        replacement: "https://www.codespartan.cloud/${1}"
        permanent: true

  routers:
    # Global HTTP to HTTPS redirect (applies to all HTTP traffic)
    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entrypoints:
        - web
      middlewares:
        - https-redirect
      service: noop@internal
      priority: 1

    # Redirect apex codespartan.cloud -> www.codespartan.cloud
    codespartan-apex:
      rule: "Host(`codespartan.cloud`)"
      entrypoints:
        - websecure
      middlewares:
        - codespartan-apex-redirect
      service: noop@internal
      tls:
        certResolver: le

    # api.cyberdyne-systems.es -> Nest API (codespartan-api) on the APIs VPS,
    # private network 10.0.0.0/24. Traefik only terminates TLS.
    cyberdyne-api:
      rule: "Host(`api.cyberdyne-systems.es`)"
      entrypoints:
        - websecure
      service: cyberdyne-api-service
      tls:
        certResolver: le

    # Signed media URLs for Social Posts, served by MinIO on the APIs VPS.
    cyberdyne-media:
      rule: "Host(`media.cyberdyne-systems.es`) && (Method(`GET`) || Method(`HEAD`))"
      entrypoints:
        - websecure
      middlewares:
        - security-headers@file
      service: cyberdyne-media-service
      tls:
        certResolver: le

    # www + apex cyberdyne-systems.es -> frontend (codespartan-frontend) on APIs VPS
    cyberdyne-www:
      rule: "Host(`www.cyberdyne-systems.es`) || Host(`cyberdyne-systems.es`)"
      entrypoints:
        - websecure
      service: cyberdyne-www-service
      tls:
        certResolver: le

    # crm.codespartan.cloud -> Twenty CRM (twenty-server) on the APIs VPS,
    # reached over the codespartan-internal private network (10.0.0.0/24).
    # Protected by Authelia ForwardAuth (same middleware as job-hunter).
    # API calls from dental-ia must use http://10.0.0.3:3000 (private), not this host.
    crm:
      rule: "Host(`crm.codespartan.cloud`)"
      entrypoints:
        - websecure
      middlewares:
        # codespartan.cloud cookie scope → portal auth.codespartan.cloud
        - authelia-codespartan@docker
        - security-headers@file
      service: crm-service
      tls:
        certResolver: le

    # lab.dental-ia.es -> app real de DentalFlow (backend+frontend+db+redis)
    # en el VPS de APIs, red privada 10.0.0.0/24. Enrutado por path, un
    # único origen para el navegador: /api y /public van al backend, el
    # resto al frontend. Prioridad alta para que gane sobre el catch-all.
    dental-lab-api:
      rule: "Host(`lab.dental-ia.es`) && (PathPrefix(`/api`) || PathPrefix(`/public`))"
      entrypoints:
        - websecure
      middlewares:
        - security-headers@file
      service: dental-lab-api-service
      tls:
        certResolver: le
      priority: 100

    dental-lab-www:
      rule: "Host(`lab.dental-ia.es`)"
      entrypoints:
        - websecure
      middlewares:
        - security-headers@file
        - compression@file
      service: dental-lab-www-service
      tls:
        certResolver: le
      priority: 1

  services:
    # Nest API (ft-rc-bko-social_posts backend) on the APIs VPS
    cyberdyne-api-service:
      loadBalancer:
        servers:
          - url: "http://10.0.0.3:3081"

    # MinIO S3 API for signed Social Posts media URLs.
    cyberdyne-media-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.0.0.3:9000"

    # Frontend (ft-rc-bko-social_posts) on the APIs VPS
    cyberdyne-www-service:
      loadBalancer:
        servers:
          - url: "http://10.0.0.3:3080"

    # Twenty CRM (twenty-server) on the APIs VPS, private network
    crm-service:
      loadBalancer:
        servers:
          - url: "http://10.0.0.3:3000"

    # DentalFlow backend (dental-lab-backend) on the APIs VPS
    dental-lab-api-service:
      loadBalancer:
        servers:
          - url: "http://10.0.0.3:3091"

    # DentalFlow frontend (dental-lab-frontend) on the APIs VPS
    dental-lab-www-service:
      loadBalancer:
        servers:
          - url: "http://10.0.0.3:3090"

# TLS configuration (if needed)
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
